<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1115">
  <title>客厅遥控</title>
  <link rel="stylesheet" href="/assets/index.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <h1>Phone Remote</h1>
        <div class="connection"><span id="dot" class="dot"></span><span id="status" data-i18n="connecting">正在连接</span></div>
      </div>
      <select id="languageSelect" class="language-select" aria-label="语言"><option value="zh">中文</option><option value="en">English</option></select>
      <button id="powerButton" class="header-button" data-i18n-aria="powerMenu" aria-label="电源菜单" title="电源菜单">
        <img class="icon" src="/assets/power.svg" alt="">
      </button>
    </header>

    <div class="views">
      <section id="view-remote" class="view active" data-i18n-aria="remoteControls" aria-label="遥控按键">
        <div class="quick-actions">
          <button class="action-button" data-action="escape"><img class="icon" src="/assets/undo-2.svg" alt=""><span data-i18n="back">返回</span></button>
          <button class="action-button primary" data-action="desktop"><img class="icon" src="/assets/house.svg" alt=""><span data-i18n="desktop">桌面</span></button>
          <button class="action-button" data-action="close_active"><img class="icon" src="/assets/x.svg" alt=""><span data-i18n="close">关闭</span></button>
        </div>
        <div class="dpad">
          <button class="up" data-action="up" data-repeat data-i18n-aria="up" aria-label="向上" title="向上"><img class="icon" src="/assets/arrow-up.svg" alt=""></button>
          <button class="left" data-action="left" data-repeat data-i18n-aria="left" aria-label="向左" title="向左"><img class="icon" src="/assets/arrow-left.svg" alt=""></button>
          <button class="ok" data-action="enter" data-i18n-aria="confirm" aria-label="确认" title="确认"><img class="icon" src="/assets/circle-dot.svg" alt=""></button>
          <button class="right" data-action="right" data-repeat data-i18n-aria="right" aria-label="向右" title="向右"><img class="icon" src="/assets/arrow-right.svg" alt=""></button>
          <button class="down" data-action="down" data-repeat data-i18n-aria="down" aria-label="向下" title="向下"><img class="icon" src="/assets/arrow-down.svg" alt=""></button>
        </div>
        <div class="media-controls">
          <button class="media-button" data-action="volume_down" data-repeat data-i18n-aria="volumeDown" aria-label="降低音量" title="降低音量"><span class="volume-combo"><img class="icon" src="/assets/volume-1.svg" alt=""><strong>−</strong></span></button>
          <button class="media-button" data-action="volume_mute" data-i18n-aria="mute" aria-label="静音" title="静音"><img class="icon" src="/assets/volume-x.svg" alt=""></button>
          <button class="media-button" data-action="media_play_pause" data-i18n-aria="playPause" aria-label="播放或暂停" title="播放或暂停"><img class="icon" src="/assets/play.svg" alt=""></button>
          <button class="media-button" data-action="volume_up" data-repeat data-i18n-aria="volumeUp" aria-label="提高音量" title="提高音量"><span class="volume-combo"><img class="icon" src="/assets/volume-1.svg" alt=""><strong>+</strong></span></button>
          <button class="media-button" data-action="f11" data-i18n-aria="fullscreen" aria-label="全屏" title="全屏"><img class="icon" src="/assets/maximize-2.svg" alt=""></button>
        </div>
      </section>

      <section id="view-touch" class="view" data-i18n-aria="touchpad" aria-label="触控板">
        <div id="touchpad" class="touchpad" data-i18n-aria="touchHelp" aria-label="单指移动，轻点单击，双指滚动" title="单指移动，轻点单击，双指滚动">
          <div class="touchpad-center"><img class="icon" src="/assets/mouse-pointer-2.svg" alt=""><span data-i18n="touchpad">触控板</span></div>
        </div>
        <div class="mouse-buttons">
          <button class="mouse-button" data-mouse-click="left" data-i18n="leftClick">左键</button>
          <button class="mouse-button" data-mouse-click="double" data-i18n="doubleClick">双击</button>
          <button class="mouse-button" data-mouse-click="right" data-i18n="rightClick">右键</button>
        </div>
        <div class="touch-media">
          <button class="action-button" data-action="escape"><img class="icon" src="/assets/undo-2.svg" alt=""><span data-i18n="back">返回</span></button>
          <button class="action-button primary" data-action="desktop"><img class="icon" src="/assets/house.svg" alt=""><span data-i18n="desktop">桌面</span></button>
          <button class="action-button" data-action="media_play_pause"><img class="icon" src="/assets/play.svg" alt=""><span data-i18n="play">播放</span></button>
        </div>
      </section>

      <section id="view-apps" class="view" data-i18n-aria="apps" aria-label="应用">
        <div id="appGrid" class="app-grid"></div>
      </section>

      <section id="view-keyboard" class="view" data-i18n-aria="keyboard" aria-label="键盘输入">
        <textarea id="keyboardInput" class="keyboard-input" maxlength="2000" enterkeyhint="send" data-i18n-placeholder="typeText" placeholder="输入文字" autocomplete="off"></textarea>
        <button id="sendTextButton" class="keyboard-send"><img class="icon" src="/assets/send.svg" alt=""><span data-i18n="send">发送</span></button>
        <div class="keyboard-keys">
          <button data-action="back" data-i18n="backspace">退格</button>
          <button data-action="enter" data-i18n="enter">回车</button>
          <button data-action="tab">Tab</button>
          <button id="clearTextButton" data-i18n="clear">清空</button>
        </div>
      </section>
    </div>

    <nav data-i18n-aria="remotePages" aria-label="遥控器页面">
      <button class="tab-button active" data-view="remote"><img class="icon" src="/assets/gamepad-2.svg" alt=""><span data-i18n="remote">遥控</span></button>
      <button class="tab-button" data-view="touch"><img class="icon" src="/assets/mouse-pointer-2.svg" alt=""><span data-i18n="touch">触控</span></button>
      <button class="tab-button" data-view="apps"><img class="icon" src="/assets/layout-grid.svg" alt=""><span data-i18n="apps">应用</span></button>
      <button class="tab-button" data-view="keyboard"><img class="icon" src="/assets/keyboard.svg" alt=""><span data-i18n="keyboard">键盘</span></button>
    </nav>
  </main>

  <dialog id="pairDialog">
    <div class="pair-form">
      <h2 data-i18n="securePairing">安全配对</h2>
      <p id="pairHelp" class="pair-help" data-i18n="firstPair">首次连接需要由 Windows Companion 显示一次性验证码。</p>
      <input id="deviceName" maxlength="120" autocomplete="name" data-i18n-placeholder="deviceName" placeholder="此设备名称">
      <button id="requestPair" class="primary" data-i18n="requestCode">请求验证码</button>
      <div id="completePairPane" class="pair-form hidden">
        <input id="pairCode" class="pair-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000">
        <button id="completePair" class="primary" data-i18n="completePairing">完成配对</button>
      </div>
    </div>
  </dialog>

  <dialog id="powerDialog">
    <div id="powerMenu">
      <h2 data-i18n="power">电源</h2>
      <div class="power-grid">
        <button class="warning" data-confirm="sleep" data-i18n="standby">待机 (S3)</button>
        <button class="warning" data-confirm="hibernate" data-i18n="hibernate">休眠</button>
        <button class="danger" data-confirm="restart" data-i18n="restart">重启</button>
        <button class="danger" data-confirm="shutdown" data-i18n="shutdown">关机</button>
      </div>
      <div class="dialog-actions"><button id="closePower" data-i18n="cancel">取消</button></div>
    </div>
    <div id="confirmPane" class="hidden">
      <h2 id="confirmTitle" data-i18n="confirmActionTitle">确认操作</h2>
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button id="backToPower" data-i18n="back">返回</button>
        <button id="confirmAction" class="danger" data-i18n="confirm">确认</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/assets/index.js"></script>
</body>
</html>
