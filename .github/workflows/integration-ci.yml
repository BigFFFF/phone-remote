name: Server Mobile Integration CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "mobile/**"
      - "protocol/**"
      - "tools/sync_version.py"
      - "VERSION"
      - ".github/workflows/integration-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "mobile/**"
      - "protocol/**"
      - "tools/sync_version.py"
      - "VERSION"
      - ".github/workflows/integration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_HOSTED_URL: https://pub.dev

jobs:
  live-server-mobile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/pyproject.toml
            server/constraints.txt
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Install server dependencies
        run: python -m pip install -c .\server\constraints.txt -e .\server
      - name: Get mobile dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Check release version
        run: python tools\sync_version.py
      - name: Exercise the real server through the mobile client
        working-directory: mobile
        env:
          PHONE_REMOTE_LIVE_SERVER_TEST: "1"
          PHONE_REMOTE_PYTHON: python
        run: flutter test test/live_server_integration_test.dart
