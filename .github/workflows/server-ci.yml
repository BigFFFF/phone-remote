name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "protocol/**"
      - "packaging/windows/**"
      - "tools/sync_version.py"
      - "VERSION"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "protocol/**"
      - "packaging/windows/**"
      - "tools/sync_version.py"
      - "VERSION"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/pyproject.toml
            server/constraints.txt
      - name: Install dependencies
        run: python -m pip install -c .\server\constraints.txt -e ".\server[dev]"
      - name: Check release version
        run: python tools\sync_version.py
      - name: Ruff format
        run: ruff format --check server tools
      - name: Ruff lint
        run: ruff check server tools
      - name: Server tests
        working-directory: server
        run: pytest --cov=phone_remote --cov-report=term-missing --cov-report=xml --cov-fail-under=72
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-coverage
          path: server/coverage.xml
          if-no-files-found: error
      - name: PyInstaller smoke build
        run: >-
          python -m PyInstaller --noconfirm --clean
          --distpath dist --workpath build\pyinstaller
          packaging\windows\PhoneRemote.spec
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath '.\dist\PhoneRemote.exe')) {
            throw 'PhoneRemote.exe was not produced.'
          }
          $process = Start-Process -FilePath '.\dist\PhoneRemote.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Smoke check failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PhoneRemote-server-smoke
          path: dist/PhoneRemote.exe
          if-no-files-found: error
