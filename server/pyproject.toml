[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-remote"
version = "1.4.0"
description = "Secure LAN remote-control companion for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "All rights reserved" }
dependencies = [
  "cryptography>=43,<51",
  "Pillow>=10,<13",
  "pystray>=0.19,<1",
  "zeroconf>=0.132,<1",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "PyYAML>=6,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
phone-remote = "phone_remote.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phone_remote*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
