name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "protocol/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Install Android SDK baseline
        run: >-
          sdkmanager
          "platform-tools"
          "platforms;android-34"
          "platforms;android-36"
          "build-tools;33.0.1"
          "build-tools;36.0.0"
      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - name: Verify unsigned release AAB structure
        working-directory: mobile
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneRemote-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios-no-sign:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build iOS without signing
        working-directory: mobile
        run: flutter build ios --debug --no-codesign
