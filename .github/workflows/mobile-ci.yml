name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "protocol/**"
      - "tools/sync_version.py"
      - "VERSION"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "protocol/**"
      - "tools/sync_version.py"
      - "VERSION"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_HOSTED_URL: https://pub.dev

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Install Android SDK baseline
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Check release version
        run: python3 tools/sync_version.py
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test --coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: error
      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - name: Verify unsigned release AAB structure
        working-directory: mobile
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PhoneRemote-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios-no-sign:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Build iOS without signing
        working-directory: mobile
        run: flutter build ios --debug --no-codesign
