<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1115">
  <title>客厅遥控</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1115;
      --surface: #171d22;
      --surface-raised: #20282f;
      --surface-pressed: #2a353e;
      --line: #303a42;
      --text: #f4f7f9;
      --muted: #9ba8b2;
      --teal: #21b6a6;
      --danger: #e05d56;
      --ok: #57c47b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      overscroll-behavior: none;
    }
    body { min-height: 100dvh; display: flex; justify-content: center; }
    button {
      border: 0;
      border-radius: 8px;
      color: var(--text);
      background: var(--surface-raised);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
      touch-action: manipulation;
      user-select: none;
    }
    button:active, button.is-pressed { background: var(--surface-pressed); transform: scale(0.975); }
    button:focus-visible { outline: 3px solid rgba(90, 141, 238, 0.7); outline-offset: 2px; }
    button.busy { opacity: 0.62; pointer-events: none; }
    .icon {
      width: 23px;
      height: 23px;
      display: block;
      filter: brightness(0) invert(1);
      pointer-events: none;
    }
    .shell {
      width: min(100%, 540px);
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      background: var(--bg);
    }
    header {
      min-height: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: max(10px, env(safe-area-inset-top)) 14px 8px;
      border-bottom: 1px solid var(--line);
    }
    .brand { min-width: 0; flex: 1; }
    h1 { margin: 0; font-size: 19px; line-height: 1.15; font-weight: 760; letter-spacing: 0; }
    .connection {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
    .dot.connected { background: var(--ok); }
    .header-button { width: 44px; height: 44px; display: grid; place-items: center; flex: 0 0 auto; }
    .language-select { min-height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 0 7px; background: var(--surface); color: var(--text); font: inherit; font-weight: 700; }
    .views { min-height: 0; overflow: hidden; }
    .view {
      display: none;
      height: 100%;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
      scrollbar-width: none;
    }
    .view::-webkit-scrollbar { display: none; }
    .view.active { display: grid; }
    #view-remote {
      grid-template-rows: auto minmax(252px, 1fr) auto;
      gap: 12px;
      align-items: center;
    }
    .quick-actions, .media-controls, .mouse-buttons { display: grid; gap: 8px; }
    .quick-actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .media-controls { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .mouse-buttons { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .action-button {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .action-button.primary { background: #127f76; }
    .action-button.primary:active { background: #169c90; }
    .dpad {
      width: min(100%, 340px);
      aspect-ratio: 1;
      justify-self: center;
      align-self: center;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .dpad button {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .dpad .up { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .ok { grid-column: 2; grid-row: 2; background: #e8eef2; color: #10161a; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 3; }
    .dpad .ok .icon { filter: none; opacity: 0.88; }
    .dpad .icon { width: 31px; height: 31px; }
    .media-button { min-height: 54px; display: grid; place-items: center; padding: 0; }
    .volume-combo { position: relative; width: 29px; height: 25px; pointer-events: none; }
    .volume-combo .icon { position: absolute; left: 0; bottom: 0; width: 22px; height: 22px; }
    .volume-combo strong {
      position: absolute;
      top: -6px;
      right: -2px;
      font-size: 18px;
      line-height: 1;
      color: var(--text);
    }
    #view-touch { grid-template-rows: minmax(280px, 1fr) auto auto; gap: 10px; }
    .touchpad {
      position: relative;
      min-height: 280px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      touch-action: none;
      overscroll-behavior: contain;
      -webkit-user-select: none;
      user-select: none;
    }
    .touchpad::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px dashed #39454e;
      border-radius: 8px;
      pointer-events: none;
    }
    .touchpad.active { border-color: var(--teal); background: #1b242a; }
    .touchpad-center { display: grid; place-items: center; gap: 8px; font-weight: 700; pointer-events: none; }
    .touchpad-center .icon { width: 32px; height: 32px; opacity: 0.65; }
    .mouse-button { min-height: 58px; }
    .touch-media { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    #view-apps { align-content: start; gap: 12px; }
    .app-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .app-button {
      min-height: 104px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 9px;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .app-icon { width: 46px; height: 46px; object-fit: contain; border-radius: 7px; pointer-events: none; }
    .app-icon.fallback { padding: 8px; filter: brightness(0) invert(1); opacity: 0.7; }
    .app-label {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }
    .app-empty {
      grid-column: 1 / -1;
      min-height: 160px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-weight: 700;
    }
    #view-keyboard {
      grid-template-rows: minmax(190px, 1fr) auto auto;
      gap: 10px;
    }
    .keyboard-input {
      width: 100%;
      min-height: 190px;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      padding: 16px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 17px;
      line-height: 1.55;
      letter-spacing: 0;
    }
    .keyboard-input:focus { border-color: var(--teal); }
    .keyboard-send { min-height: 58px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #127f76; }
    .keyboard-keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .keyboard-keys button { min-height: 54px; }
    nav {
      min-height: 68px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      padding: 7px 10px max(7px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: #11171b;
    }
    .tab-button {
      min-width: 0;
      min-height: 54px;
      display: grid;
      grid-template-columns: auto auto;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--muted);
      background: transparent;
    }
    .tab-button.active { color: var(--text); background: #263038; }
    dialog {
      width: min(90vw, 380px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 16px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.68); }
    dialog h2 { margin: 0 0 14px; font-size: 18px; letter-spacing: 0; }
    dialog p { margin: 0 0 16px; color: var(--muted); }
    .power-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .power-grid button { min-height: 66px; }
    .danger { background: #8f3431; }
    .warning { background: #805b1f; }
    .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    #powerMenu .dialog-actions { grid-template-columns: 1fr; }
    .dialog-actions button { min-height: 52px; }
    .pair-form { display: grid; gap: 10px; min-width: min(82vw, 360px); }
    .pair-form input { min-height: 48px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; background: var(--panel); color: var(--text); font: inherit; }
    .pair-code { text-align: center; letter-spacing: 7px; font: 700 26px ui-monospace, monospace !important; }
    .pair-help { color: var(--muted); margin: 0; line-height: 1.45; }
    .hidden { display: none !important; }
    .toast {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: calc(82px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(18px);
      width: max-content;
      max-width: min(88vw, 420px);
      padding: 10px 14px;
      border-radius: 8px;
      background: #edf3f5;
      color: #11171b;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      transition: opacity 140ms ease, transform 140ms ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-height: 700px) {
      header { min-height: 54px; padding-top: max(7px, env(safe-area-inset-top)); }
      #view-remote { grid-template-rows: auto minmax(224px, 1fr) auto; padding-top: 9px; padding-bottom: 9px; }
      .dpad { width: min(72vw, 292px); }
      .action-button, .media-button { min-height: 48px; }
      nav { min-height: 62px; }
      .tab-button { min-height: 48px; }
    }
    @media (min-width: 700px) {
      .shell { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <h1>Phone Remote</h1>
        <div class="connection"><span id="dot" class="dot"></span><span id="status" data-i18n="connecting">正在连接</span></div>
      </div>
      <select id="languageSelect" class="language-select" aria-label="语言"><option value="zh">中文</option><option value="en">English</option></select>
      <button id="powerButton" class="header-button" data-i18n-aria="powerMenu" aria-label="电源菜单" title="电源菜单">
        <img class="icon" src="/assets/power.svg" alt="">
      </button>
    </header>

    <div class="views">
      <section id="view-remote" class="view active" data-i18n-aria="remoteControls" aria-label="遥控按键">
        <div class="quick-actions">
          <button class="action-button" data-action="escape"><img class="icon" src="/assets/undo-2.svg" alt=""><span data-i18n="back">返回</span></button>
          <button class="action-button primary" data-action="desktop"><img class="icon" src="/assets/house.svg" alt=""><span data-i18n="desktop">桌面</span></button>
          <button class="action-button" data-action="close_active"><img class="icon" src="/assets/x.svg" alt=""><span data-i18n="close">关闭</span></button>
        </div>
        <div class="dpad">
          <button class="up" data-action="up" data-repeat data-i18n-aria="up" aria-label="向上" title="向上"><img class="icon" src="/assets/arrow-up.svg" alt=""></button>
          <button class="left" data-action="left" data-repeat data-i18n-aria="left" aria-label="向左" title="向左"><img class="icon" src="/assets/arrow-left.svg" alt=""></button>
          <button class="ok" data-action="enter" data-i18n-aria="confirm" aria-label="确认" title="确认"><img class="icon" src="/assets/circle-dot.svg" alt=""></button>
          <button class="right" data-action="right" data-repeat data-i18n-aria="right" aria-label="向右" title="向右"><img class="icon" src="/assets/arrow-right.svg" alt=""></button>
          <button class="down" data-action="down" data-repeat data-i18n-aria="down" aria-label="向下" title="向下"><img class="icon" src="/assets/arrow-down.svg" alt=""></button>
        </div>
        <div class="media-controls">
          <button class="media-button" data-action="volume_down" data-repeat data-i18n-aria="volumeDown" aria-label="降低音量" title="降低音量"><span class="volume-combo"><img class="icon" src="/assets/volume-1.svg" alt=""><strong>−</strong></span></button>
          <button class="media-button" data-action="volume_mute" data-i18n-aria="mute" aria-label="静音" title="静音"><img class="icon" src="/assets/volume-x.svg" alt=""></button>
          <button class="media-button" data-action="media_play_pause" data-i18n-aria="playPause" aria-label="播放或暂停" title="播放或暂停"><img class="icon" src="/assets/play.svg" alt=""></button>
          <button class="media-button" data-action="volume_up" data-repeat data-i18n-aria="volumeUp" aria-label="提高音量" title="提高音量"><span class="volume-combo"><img class="icon" src="/assets/volume-1.svg" alt=""><strong>+</strong></span></button>
          <button class="media-button" data-action="f11" data-i18n-aria="fullscreen" aria-label="全屏" title="全屏"><img class="icon" src="/assets/maximize-2.svg" alt=""></button>
        </div>
      </section>

      <section id="view-touch" class="view" data-i18n-aria="touchpad" aria-label="触控板">
        <div id="touchpad" class="touchpad" data-i18n-aria="touchHelp" aria-label="单指移动，轻点单击，双指滚动" title="单指移动，轻点单击，双指滚动">
          <div class="touchpad-center"><img class="icon" src="/assets/mouse-pointer-2.svg" alt=""><span data-i18n="touchpad">触控板</span></div>
        </div>
        <div class="mouse-buttons">
          <button class="mouse-button" data-mouse-click="left" data-i18n="leftClick">左键</button>
          <button class="mouse-button" data-mouse-click="double" data-i18n="doubleClick">双击</button>
          <button class="mouse-button" data-mouse-click="right" data-i18n="rightClick">右键</button>
        </div>
        <div class="touch-media">
          <button class="action-button" data-action="escape"><img class="icon" src="/assets/undo-2.svg" alt=""><span data-i18n="back">返回</span></button>
          <button class="action-button primary" data-action="desktop"><img class="icon" src="/assets/house.svg" alt=""><span data-i18n="desktop">桌面</span></button>
          <button class="action-button" data-action="media_play_pause"><img class="icon" src="/assets/play.svg" alt=""><span data-i18n="play">播放</span></button>
        </div>
      </section>

      <section id="view-apps" class="view" data-i18n-aria="apps" aria-label="应用">
        <div id="appGrid" class="app-grid"></div>
      </section>

      <section id="view-keyboard" class="view" data-i18n-aria="keyboard" aria-label="键盘输入">
        <textarea id="keyboardInput" class="keyboard-input" maxlength="2000" enterkeyhint="send" data-i18n-placeholder="typeText" placeholder="输入文字" autocomplete="off"></textarea>
        <button id="sendTextButton" class="keyboard-send"><img class="icon" src="/assets/send.svg" alt=""><span data-i18n="send">发送</span></button>
        <div class="keyboard-keys">
          <button data-action="back" data-i18n="backspace">退格</button>
          <button data-action="enter" data-i18n="enter">回车</button>
          <button data-action="tab">Tab</button>
          <button id="clearTextButton" data-i18n="clear">清空</button>
        </div>
      </section>
    </div>

    <nav data-i18n-aria="remotePages" aria-label="遥控器页面">
      <button class="tab-button active" data-view="remote"><img class="icon" src="/assets/gamepad-2.svg" alt=""><span data-i18n="remote">遥控</span></button>
      <button class="tab-button" data-view="touch"><img class="icon" src="/assets/mouse-pointer-2.svg" alt=""><span data-i18n="touch">触控</span></button>
      <button class="tab-button" data-view="apps"><img class="icon" src="/assets/layout-grid.svg" alt=""><span data-i18n="apps">应用</span></button>
      <button class="tab-button" data-view="keyboard"><img class="icon" src="/assets/keyboard.svg" alt=""><span data-i18n="keyboard">键盘</span></button>
    </nav>
  </main>

  <dialog id="pairDialog">
    <div class="pair-form">
      <h2 data-i18n="securePairing">安全配对</h2>
      <p id="pairHelp" class="pair-help" data-i18n="firstPair">首次连接需要由 Windows Companion 显示一次性验证码。</p>
      <input id="deviceName" maxlength="120" autocomplete="name" data-i18n-placeholder="deviceName" placeholder="此设备名称">
      <button id="requestPair" class="primary" data-i18n="requestCode">请求验证码</button>
      <div id="completePairPane" class="pair-form hidden">
        <input id="pairCode" class="pair-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000">
        <button id="completePair" class="primary" data-i18n="completePairing">完成配对</button>
      </div>
    </div>
  </dialog>

  <dialog id="powerDialog">
    <div id="powerMenu">
      <h2 data-i18n="power">电源</h2>
      <div class="power-grid">
        <button class="warning" data-confirm="sleep" data-i18n="standby">待机 (S3)</button>
        <button class="warning" data-confirm="hibernate" data-i18n="hibernate">休眠</button>
        <button class="danger" data-confirm="restart" data-i18n="restart">重启</button>
        <button class="danger" data-confirm="shutdown" data-i18n="shutdown">关机</button>
      </div>
      <div class="dialog-actions"><button id="closePower" data-i18n="cancel">取消</button></div>
    </div>
    <div id="confirmPane" class="hidden">
      <h2 id="confirmTitle" data-i18n="confirmActionTitle">确认操作</h2>
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button id="backToPower" data-i18n="back">返回</button>
        <button id="confirmAction" class="danger" data-i18n="confirm">确认</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const messages = {
      zh: { connecting: '正在连接', connected: '已连接', disconnected: '连接断开', powerMenu: '电源菜单', remoteControls: '遥控按键', remotePages: '遥控器页面', up: '向上', down: '向下', left: '向左', right: '向右', volumeDown: '降低音量', volumeUp: '提高音量', mute: '静音', playPause: '播放或暂停', fullscreen: '全屏', back: '返回', desktop: '桌面', close: '关闭', touchpad: '触控板', touchHelp: '单指移动，轻点单击，双指滚动', leftClick: '左键', doubleClick: '双击', rightClick: '右键', play: '播放', typeText: '输入文字', send: '发送', backspace: '退格', enter: '回车', clear: '清空', remote: '遥控', touch: '触控', apps: '应用', keyboard: '键盘', securePairing: '安全配对', firstPair: '首次连接需要由 Windows Companion 显示一次性验证码。', deviceName: '此设备名称', requestCode: '请求验证码', completePairing: '完成配对', power: '电源', standby: '待机 (S3)', hibernate: '休眠', restart: '重启', shutdown: '关机', cancel: '取消', confirm: '确认', confirmActionTitle: '确认操作', credentialExpired: '配对凭据已失效，请重新配对。', requestPairFailed: '无法请求配对', enterCode: seconds => `请在 ${seconds} 秒内输入 Windows Companion 显示的 6 位验证码。`, pairingRequestFailed: '配对请求失败', pairingFailed: '配对失败', pairingSuccess: '配对成功', identityChanged: '检测到 Server Identity 变化，已阻止连接。请确认后重新配对。', openingApp: name => `正在打开${name}`, appOpened: name => `${name}已打开`, desktopShown: '已显示电脑桌面', windowClosed: '已关闭当前窗口', operationFailed: '操作失败', connectionFailed: '连接失败', touchFailed: '触控失败', sendFailed: '发送失败', textSent: '文字已发送', noApps: '暂无应用', appsUnavailable: '应用配置不可用', configWarning: warning => `配置错误，已使用上次设置：${warning}`, appsLoadFailed: '应用列表加载失败', touchConnectionFailed: '触控连接失败', confirmAction: label => `确认${label}`, executesImmediately: label => `${label}会立即执行。` },
